name: 更新 IPTV 源

on:
  schedule:
    # 时间为 UTC，北京时间为 UTC+8
    - cron: '0 22 * * *'   # 北京 06:00
    - cron: '0 10 * * *'   # 北京 18:00
  workflow_dispatch:
    inputs:
      modes:
        description: '要跑的模式，逗号分隔（jsmpeg,txiptv,zhgxtv）'
        required: false
        default: 'jsmpeg,txiptv,zhgxtv'
      min_speed:
        description: '最低速度 MB/s，低于此值的源会被丢弃'
        required: false
        default: '0.2'
      max_workers:
        description: '并发数'
        required: false
        default: '40'

# 需要写权限才能把结果提交回仓库
permissions:
  contents: write

# 同一时间只允许一个实例，避免两次提交互相覆盖
concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 扫描并生成
        env:
          # 手动触发时才用输入值，定时触发为空字符串 → ci_run.py 用默认值
          MODES: ${{ github.event.inputs.modes }}
          MIN_SPEED: ${{ github.event.inputs.min_speed }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          TZ: Asia/Shanghai
        run: python ci_run.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # output/ 可能还没进仓库（网页上传会跳过空目录/以点开头的文件），先确保目录存在，
          # 否则 git add 会因 pathspec 不存在直接失败
          mkdir -p output
          git add output
          if git diff --staged --quiet; then
            echo "本轮结果与上次一致，跳过提交"
          else
            git commit -m "chore: 更新 IPTV 源 $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: 上传产物（保留 7 天，方便直接下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: output/
          retention-days: 7
